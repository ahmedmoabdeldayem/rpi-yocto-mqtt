name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  shellcheck:
    name: Shell Script Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint healthcheck script
        run: shellcheck meta-rpi-mqtt/recipes-scripts/mqtt-healthcheck/files/mqtt-healthcheck.sh

  test:
    name: Layer Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run tests
        run: bash tests/test_healthcheck.sh
