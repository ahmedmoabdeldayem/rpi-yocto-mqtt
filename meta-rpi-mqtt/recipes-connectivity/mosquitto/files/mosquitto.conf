# Mosquitto MQTT broker configuration
# Deployed via Yocto meta-rpi-mqtt layer

# Bind to loopback only — remote clients must connect via an encrypted tunnel
# (e.g. WireGuard or stunnel). Change to the device's LAN IP and add TLS
# listener 8883 before exposing this broker on a network interface.
listener 1883 127.0.0.1

# Authentication — password file must exist before starting the broker.
# IMPORTANT: provision /etc/mosquitto/passwd before first boot:
#   mosquitto_passwd -c /etc/mosquitto/passwd <username>
# The image does not ship a default passwd file; the broker will fail to start
# until credentials are created. See README for first-boot provisioning steps.
allow_anonymous false
password_file /etc/mosquitto/passwd

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Persistence: retain messages across broker restarts
persistence true
persistence_location /var/lib/mosquitto/

# Connection limits
max_connections 50
max_keepalive 60
