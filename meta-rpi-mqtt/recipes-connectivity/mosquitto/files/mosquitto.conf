# Mosquitto MQTT broker configuration
# Deployed via Yocto meta-rpi-mqtt layer

# Listen on standard MQTT port on all interfaces
listener 1883

# Authentication — password file must exist before starting the broker
# Create credentials with: mosquitto_passwd -c /etc/mosquitto/passwd <username>
allow_anonymous false
password_file /etc/mosquitto/passwd

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Persistence: retain messages across broker restarts
persistence true
persistence_location /var/lib/mosquitto/

# Connection limits
max_connections 50
max_keepalive 60
