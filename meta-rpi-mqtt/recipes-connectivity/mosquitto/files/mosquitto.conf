# Mosquitto MQTT broker configuration
# Deployed via Yocto meta-rpi-mqtt layer

# Listen on standard MQTT port on all interfaces
listener 1883

# Allow unauthenticated connections (development setup)
# For production: set allow_anonymous false and configure password_file
allow_anonymous true

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Persistence: retain messages across broker restarts
persistence true
persistence_location /var/lib/mosquitto/

# Connection limits
max_connections 50
max_keepalive 60
